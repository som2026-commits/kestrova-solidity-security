# RETIRED for the current entry. server.json is now com.onrender.kestrova-api/kestrova, published by the owner with the
# registry's HTTP domain authentication (key served at kestrova-api.onrender.com/.well-known/mcp-registry-auth).
# GitHub OIDC can only grant io.github.som2026-commits/*, so this workflow stops before publishing (guard step below).
# Manual trigger only (Actions tab -> Run workflow).
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions: {}   # nothing by default; the job below asks only for what it needs

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC login to the registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - name: Refuse when server.json is not in this workflow's namespace
        run: |
          echo "server.json is published with HTTP domain authentication, not with this GitHub OIDC workflow."
          exit 1

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
