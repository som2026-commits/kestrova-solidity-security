# Kestrova pull-request check: free preview of the CHANGED Solidity contracts (and the contracts that import them),
# compared with the same files on the target branch. Copy to .github/workflows/kestrova.yml in YOUR project.
#
# Security model:
#   - `pull_request` (not pull_request_target): fork PRs get a read-only token and no secrets; none are used anyway.
#   - PR code is untrusted: it is only READ (.sol files, foundry.toml, remappings.txt). No project scripts run:
#     dependencies are installed with --ignore-scripts, and the Kestrova CLI is an exact, immutable npm version
#     (kestrova-scan, no dependencies) installed outside the checkout, never from the pull request.
#   - The checkout does not persist the token. Nothing is paid; the free preview is rate-limited per IP, so service
#     and rate-limit errors never fail the check.
name: Kestrova
on:
  pull_request:
    paths: ["**/*.sol", "foundry.toml", "remappings.txt"]
permissions:
  contents: read
concurrency:
  group: kestrova-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changed-solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KESTROVA_FAIL_ON: none          # advisory. Set to high or medium to fail the check on NEW findings only.
      KESTROVA_CLI_VERSION: 0.1.1     # exact npm version of kestrova-scan (npm versions are immutable)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the target branch is needed for the comparison
          persist-credentials: false
          submodules: recursive       # Foundry lib/ dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Solidity dependencies without running any package scripts
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; fi
      - name: Install the Kestrova CLI (exact npm version, outside the checkout, no scripts)
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/kestrova" "kestrova-scan@$KESTROVA_CLI_VERSION"
      - name: Kestrova changed-file check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          node "$RUNNER_TEMP/kestrova/node_modules/kestrova-scan/bin/kestrova-scan.mjs" --changed "origin/$BASE_REF" --yes \
            --fail-on "$KESTROVA_FAIL_ON" --summary-md "$GITHUB_STEP_SUMMARY" --state-dir "$RUNNER_TEMP/kestrova-state"
          code=$?
          case "$code" in
            0) exit 0 ;;
            1) echo "::error::Kestrova: NEW findings at or above $KESTROVA_FAIL_ON (see the job summary)"; exit 1 ;;
            3) echo "::warning::Kestrova unavailable or rate-limited; not blocking"; exit 0 ;;
            *) echo "::warning::Kestrova could not scan this change (exit $code); see the log"; exit 0 ;;
          esac
